name: tvOS app

on:
  push:
    branches: [main, 'app/tvos-*']
    paths: ['tvos/**', 'ios/Khajistan/Services/LiveCaptionSession.swift', '.github/workflows/tvos.yml']
  # Every pull request, so the simulator check can be required on main; `changes` skips it
  # when the PR touches none of the paths above, and GitHub counts a skipped check as passed.
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Live channels instead of the local test video (TEST_RUNNER_KJ_LIVE_RECEIVER=1)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tvos-${{ github.event.pull_request.head.ref || github.ref_name }}
  # Cancel a superseded run only for pull requests. On main two lanes push minutes apart,
  # and cancelling the run in flight each time meant no run on main ever finished (2026-10-06).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A PR to another branch can be retargeted to main without a new run, so it runs too.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$GITHUB_BASE_REF" != main ]; then echo app=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # The files API lists at most 3,000 files: a bigger PR runs the simulator.
          n=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q .changed_files)
          if [ "$n" -ge 3000 ]; then echo app=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # A move lists only its new path, so the old one is read too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$files" | grep -Eq '^(tvos/|ios/Khajistan/Services/LiveCaptionSession\.swift$|\.github/workflows/tvos\.yml$)'; then echo app=true; else echo app=false; fi >> "$GITHUB_OUTPUT"
  simulator:
    name: tvOS simulator
    needs: changes
    # Fails open: the check skips only on a clear "no app files". A failed `changes` job would
    # skip it too, and GitHub counts a skipped required check as passed (Fable on PR 77).
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: macos-26
    # The UI suite outgrew 75 minutes: every tvOS run was cut at the limit from 2026-11-08 on,
    # with tests still passing (PR 48: 58 passed, 0 failed when cut). The one run allowed
    # 100 (PR 9, 2026-11-09) finished in 87, the test step alone 80, and the suite grew
    # about 12 minutes in the day before. Public repo: macOS minutes are not billed.
    # ponytail: a longer limit, not a faster suite. When this one is reached, split the UI
    # tests across two jobs (-only-testing the slow classes, -skip-testing them in the other),
    # at the cost of two of the plan's five macOS slots per push.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tvos
            ios/Khajistan/Services
          lfs: false
      - name: Core behavior tests
        run: sh tvos/scripts/test-core.sh
      - name: Caption delivery and preference regressions
        run: |
          sh tvos/scripts/test-caption-session.sh   # both platforms: this job also triggers on the iOS session
          sh tvos/scripts/test-caption-preference.sh
      - name: Account session race regressions
        run: KJ_AUTH_TEST_PLATFORMS=tvos sh tvos/scripts/test-auth-session.sh
      - name: Reading Room cache regressions
        run: sh tvos/scripts/test-reading-cache.sh
      - name: Transmission picture-in-picture session regressions
        run: sh tvos/scripts/test-transmission-pip.sh
      - name: Select an Apple TV simulator
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p tvos/.ci
          pick() {
            xcrun simctl list devices available --json > tvos/.ci/devices.json
            python3 - <<'PY'
          import json
          data = json.load(open('tvos/.ci/devices.json'))
          for runtime, devices in data['devices'].items():
              if 'tvOS' not in runtime:
                  continue
              for device in devices:
                  if device['name'].startswith('Apple TV') and device['isAvailable']:
                      print(device['udid'])
                      raise SystemExit
          PY
          }
          udid=$(pick)
          if [ -z "$udid" ]; then
            echo 'No tvOS simulator runtime installed; downloading one'
            xcodebuild -downloadPlatform tvOS
            udid=$(pick)
          fi
          if [ -z "$udid" ]; then
            echo 'No Apple TV simulator available after the tvOS runtime download' >&2
            exit 1
          fi
          echo "Selected $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Boot simulator
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Build and test tvOS app
        env:
          # A manual run with "live" on plays live carriers; every other run plays the local video.
          TEST_RUNNER_KJ_LIVE_RECEIVER: ${{ inputs.live && '1' || '0' }}
        run: |
          set -euo pipefail
          xcodebuild test -project tvos/KhajistanTV.xcodeproj -scheme KhajistanTV \
            -configuration Debug -destination "platform=tvOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath tvos/.ci/DerivedData -resultBundlePath tvos/.ci/TestResults.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee tvos/.ci/xcodebuild.log
      - name: Export screenshots and simulator app
        if: always()
        run: |
          mkdir -p tvos/.ci/screenshots
          if [ -d tvos/.ci/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path tvos/.ci/TestResults.xcresult \
              --output-path tvos/.ci/screenshots || true
          fi
          if [ -d tvos/.ci/DerivedData/Build/Products/Debug-appletvsimulator/KhajistanTV.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              tvos/.ci/DerivedData/Build/Products/Debug-appletvsimulator/KhajistanTV.app \
              tvos/.ci/KhajistanTV-Simulator.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khajistan-tvos-simulator
          retention-days: 14
          path: |
            tvos/.ci/xcodebuild.log
            tvos/.ci/screenshots
            tvos/.ci/KhajistanTV-Simulator.zip
            tvos/.ci/TestResults.xcresult
