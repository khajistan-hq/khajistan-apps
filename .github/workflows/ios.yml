name: iOS app

on:
  push:
    branches: [main, 'codex/ios-*']
    paths: ['ios/**', 'tvos/**', '.github/workflows/ios.yml']
  # Every pull request, so the simulator check can be required on main; `changes` skips it
  # when the PR touches none of the paths above, and GitHub counts a skipped check as passed.
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Live channels instead of the local test video (TEST_RUNNER_KJ_LIVE_RECEIVER=1)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ios-${{ github.event.pull_request.head.ref || github.ref_name }}
  # Cancel a superseded run only for pull requests. On main two lanes push minutes apart,
  # and cancelling the run in flight each time meant no run on main ever finished (2026-10-06).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo app=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # The files API lists at most 3,000 files: a bigger PR runs the simulator.
          n=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q .changed_files)
          if [ "$n" -ge 3000 ]; then echo app=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # A move lists only its new path, so the old one is read too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$files" | grep -Eq '^(ios/|tvos/|\.github/workflows/ios\.yml$)'; then echo app=true; else echo app=false; fi >> "$GITHUB_OUTPUT"
  simulator:
    name: iOS simulator
    needs: changes
    # Fails open: the check skips only on a clear "no app files". A failed `changes` job would
    # skip it too, and GitHub counts a skipped required check as passed (Fable on PR 77).
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    # macos-26 (Xcode 26.6 default, iOS 26 runtimes). macos-15 arm64 runners left a run queued
    # for an hour on 2026-10-06 and hung in simctl boot on the runs that did start; the tvOS job
    # on macos-26 started within minutes all day.
    runs-on: macos-26
    # The unchanged base took 33m40s; allow the full UI suite and artifact export to finish.
    # main's run of 2026-11-09 passed in 44 min 59 s against 45: one slow runner from a
    # cut. 60 gives the same headroom the tvOS job has.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            tvos
          lfs: false
      - name: Core behavior tests
        run: ios/scripts/test-core.sh
      - name: Swift package regressions
        run: swift test --package-path ios
      - name: Caption session failure regressions
        run: KJ_CAPTION_TEST_PLATFORMS=ios sh tvos/scripts/test-caption-session.sh
      - name: Account session race regressions
        run: KJ_AUTH_TEST_PLATFORMS=ios sh tvos/scripts/test-auth-session.sh
      - name: Reading Room cache regressions
        run: sh tvos/scripts/test-reading-cache.sh
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p ios/.ci
          xcrun simctl list devices available --json > ios/.ci/devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('ios/.ci/devices.json'))
          candidates = [device for runtime, devices in data['devices'].items()
                        if 'iOS-26' in runtime for device in devices
                        if device['name'].startswith('iPhone') and device['isAvailable']]
          if not candidates:
              raise SystemExit('No installed iOS 26 iPhone simulator runtime')
          device = candidates[0]
          print('Selected', device['name'], device['udid'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('udid=' + device['udid'] + '\n')
          PY
      - name: Boot simulator before UI automation
        # `simctl boot` hung for 29 minutes with no output on macos-15 (2026-10-06, three runs
        # in a row, same image/Xcode/device as the 2026-09-14 run that booted in 20 s). Boot
        # through bootstatus -b under a 10-minute alarm, and try once more after a shutdown.
        run: |
          udid='${{ steps.simulator.outputs.udid }}'
          for attempt in 1 2; do
            if perl -e 'alarm shift; exec @ARGV' 600 xcrun simctl bootstatus "$udid" -b; then
              echo "booted on attempt $attempt"; exit 0
            fi
            echo "boot attempt $attempt did not finish; shutting down and retrying" >&2
            xcrun simctl shutdown "$udid" || true
            sleep 15
          done
          echo 'simulator did not boot in two attempts' >&2; exit 1
      - name: Build and test iOS app
        env:
          # A manual run with "live" on plays live carriers; every other run plays the local video.
          TEST_RUNNER_KJ_LIVE_RECEIVER: ${{ inputs.live && '1' || '0' }}
        run: |
          set -euo pipefail
          xcodebuild test -project ios/Khajistan.xcodeproj -scheme Khajistan \
            -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/.ci/DerivedData -resultBundlePath ios/.ci/TestResults.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/.ci/xcodebuild.log
      - name: Pics/Vids store against stubbed answers
        # Retries on a busy server, and the shuffle walk reaching every object once from any
        # start, with no live data (ios/Tests/PnvRetry). About fifteen seconds. After the UI
        # tests, so nothing it runs on the simulator is there while they run.
        run: sh ios/Tests/PnvRetry/run.sh '${{ steps.simulator.outputs.udid }}' "$PWD"
      - name: Export screenshots and simulator app
        if: always()
        run: |
          mkdir -p ios/.ci/screenshots
          if [ -d ios/.ci/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/.ci/TestResults.xcresult \
              --output-path ios/.ci/screenshots || true
          fi
          if [ -d ios/.ci/DerivedData/Build/Products/Debug-iphonesimulator/Khajistan.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              ios/.ci/DerivedData/Build/Products/Debug-iphonesimulator/Khajistan.app \
              ios/.ci/Khajistan-Simulator.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khajistan-ios-simulator
          retention-days: 14
          path: |
            ios/.ci/xcodebuild.log
            ios/.ci/screenshots
            ios/.ci/Khajistan-Simulator.zip
            ios/.ci/TestResults.xcresult
